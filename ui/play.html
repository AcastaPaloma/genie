<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Neuroframe — Play DOOM on the fly brain</title><link rel="icon" href="/favicon.svg"/>
<style>
html,body{margin:0;height:100%;background:#101619;color:#e6ecef;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
#play{position:fixed;inset:0;display:grid;grid-template-columns:2fr 3fr;grid-template-rows:58fr 42fr;grid-template-areas:"doom brain" "fly fly";gap:4px;background:#101619}
#doom{grid-area:doom;display:grid;place-items:center;background:#000;min-width:0;min-height:0;overflow:hidden}
#doom canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#brain{grid-area:brain;position:relative;min-width:0;min-height:0;overflow:hidden}
#fly{grid-area:fly;position:relative;min-width:0;min-height:0;overflow:hidden}
#brain canvas,#fly canvas{display:block}
.label{position:absolute;left:10px;top:8px;font-size:12px;opacity:.65;pointer-events:none;text-shadow:0 1px 3px #000}
#hud{position:fixed;left:12px;right:12px;bottom:8px;pointer-events:none;text-shadow:0 1px 3px #000}
#status{font-size:15px}
#body-status{font-size:13px;opacity:.85}
#keys{font-size:12px;opacity:.65}
#overlay{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#101619;z-index:2}
#overlay-title{font-size:32px;font-weight:600}
#overlay-detail{font-size:20px;opacity:.8;margin-top:8px;white-space:pre-wrap;max-width:80vw}
@media(max-width:900px){#play{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr;grid-template-areas:"doom" "brain" "fly"}}
</style></head>
<body><!-- DOOM frame | full brain on top, the physical fly across the bottom. World model only; keyboard only. -->
<div id="play"></div><script type="module" src="/body/runtime.js"></script><script type="module" src="/src/play.ts"></script></body></html>
